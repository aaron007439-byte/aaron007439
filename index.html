<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萬能工商資訊科 - 檢定報到入口網</title>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            padding: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: var(--text-color);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 20px 25px -5px rgba(0, 123, 255, 0.2);
        }

        .card-icon {
            font-size: 3.5rem;
            text-align: center;
            padding: 2.5rem 0 1rem 0;
            background: linear-gradient(180deg, rgba(0,123,255,0.1) 0%, rgba(0,0,0,0) 100%);
        }

        .card-content {
            padding: 1.5rem;
            text-align: center;
            flex-grow: 1;
        }

        .card-content h2 {
            font-size: 1.5rem;
            margin-bottom: 0.8rem;
            color: #fff;
        }

        .card-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .card-btn {
            margin: 1.5rem auto;
            padding: 0.75rem 2rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 80%;
        }

        .card:hover .card-btn {
            background-color: var(--primary-hover);
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* 響應式微調 */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }
            .container {
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>萬能工商資訊科</h1>
        <p>國家檢定即測即評專區 - 入口網站</p>
    </header>

    <main class="container">
        <!-- 學科報到 -->
        <a href="subject_checkin.html" class="card">
            <div class="card-icon">📝</div>
            <div class="card-content">
                <h2>學科報到</h2>
                <p>請於測試前 30 分鐘辦理報到，務必攜帶准考證與附照片之身分證件正本。</p>
            </div>
            <button class="card-btn">進入報到</button>
        </a>

        <!-- 術科報到 -->
        <a href="technical_checkin.html" class="card">
            <div class="card-icon">💻</div>
            <div class="card-content">
                <h2>術科報到</h2>
                <p>進入試場前請確認服裝儀容，並檢查自備工具是否符合資訊類檢定規範。</p>
            </div>
            <button class="card-btn">進入報到</button>
        </a>

        <!-- 術科電子抽籤 -->
        <a href="https://eservice.wdasec.gov.tw/cla/Ballot/Ballot.aspx" target="_blank" class="card">
            <div class="card-icon">🎲</div>
            <div class="card-content">
                <h2>術科電子抽籤</h2>
                <p>連結至勞動部官方抽籤系統。正式測試前將由監場人員指引抽取題組與崗位。</p>
            </div>
            <button class="card-btn">前往抽籤網</button>
        </a>
    </main>

    <footer>
        <p>&copy; 2026-27 萬能工商 資訊科 技能檢定試務中心 版權所有</p>
    </footer>

</body>
</html>
