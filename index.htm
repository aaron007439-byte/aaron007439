<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萬能工商資訊科 - 檢定報到入口網</title>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #ef4444;
            --seat-active: #10b981;
            --seat-spare: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            width: 100%;
        }

        header h1 {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 3rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            padding: 1rem;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: var(--text-color);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 20px 25px -5px rgba(0, 123, 255, 0.2);
        }

        .card-icon {
            font-size: 3.5rem;
            text-align: center;
            padding: 2.5rem 0 1rem 0;
            background: linear-gradient(180deg, rgba(0,123,255,0.1) 0%, rgba(0,0,0,0) 100%);
        }

        .card-content {
            padding: 1.5rem;
            text-align: center;
            flex-grow: 1;
        }

        .card-content h2 {
            font-size: 1.5rem;
            margin-bottom: 0.8rem;
            color: #fff;
        }

        .card-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .card-btn {
            margin: 1.5rem auto;
            padding: 0.75rem 2rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            transition: background-color 0.2s ease;
            width: 80%;
            display: block;
        }

        .card:hover .card-btn {
            background-color: var(--primary-hover);
        }

        .page-content {
            max-width: 800px;
            margin: 4rem auto 0 auto;
            width: 100%;
            padding-top: 2rem;
            border-top: 1px solid #334155;
        }

        .back-btn {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            margin-bottom: 1.5rem;
            font-weight: bold;
            font-size: 1rem;
        }

        .back-btn:hover { text-decoration: underline; }
        
        .page-content h1 { 
            font-size: 2rem; 
            margin-bottom: 1.5rem; 
            border-left: 5px solid var(--primary-color); 
            padding-left: 0.75rem; 
            text-shadow: 0 0 10px rgba(0, 123, 255, 0.3);
            color: #fff;
        }

        .section { background: var(--card-bg); border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .section h2 { font-size: 1.3rem; margin-bottom: 1rem; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
        
        ul { list-style: none; }
        li { margin-bottom: 0.75rem; position: relative; padding-left: 1.5rem; color: var(--text-color); }
        li::before { content: "▪"; color: var(--primary-color); position: absolute; left: 0; font-size: 1.2rem; top: -2px; }
        
        strong { color: #fff; background: linear-gradient(180deg,transparent 60%, rgba(0,123,255,0.3) 40%); padding: 0 2px; }
        .alert-text { color: var(--accent-color); font-weight: bold; }
        .footer-note { text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem; }

        /* 考場座位配置矩陣專屬樣式 */
        .seat-map-podium {
            background-color: #0f172a;
            border: 1px dashed var(--primary-color);
            text-align: center;
            padding: 0.75rem;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            color: #fff;
            letter-spacing: 2px;
        }

        .responsive-table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            padding: 1rem;
        }

        /* 學科 5x10 網格樣式 (由上往下遞減，走道分離) */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem 1.2rem;
            min-width: 650px;
            text-align: center;
        }

        /* 術科 4x6 網格樣式 (由下往上遞增) */
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem 1.5rem;
            min-width: 500px;
            text-align: center;
        }

        .grid-gap-row {
            grid-column: span 5;
            height: 20px;
            position: relative;
        }
        .grid-gap-row::before {
            content: "【 中央走道 】";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 4px;
        }

        .seat-cell {
            background-color: var(--card-bg);
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 0.6rem 0.4rem;
            font-size: 0.95rem;
            color: #fff;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        
        .seat-cell.active-seat {
            border-left: 4px solid var(--seat-active);
        }

        .seat-cell.spare-seat {
            border-left: 4px solid var(--seat-spare);
            color: var(--seat-spare);
            background-color: rgba(245, 158, 11, 0.05);
        }

        .map-title-tag {
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
            margin-top: 1rem;
            letter-spacing: 1px;
        }

        footer {
            margin-top: 4rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            width: 100%;
            border-top: 1px solid #1e293b;
            padding-top: 1.5rem;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .grid-container { gap: 1.5rem; }
            .page-content h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <header id="top">
        <h1>萬能工商資訊科</h1>
        <p>國家檢定即測即評專區 - 入口網站</p>
    </header>

    <div class="container">
        <!-- 主首頁面卡片選單 -->
        <div class="grid-container">
            <a href="#subject-section" class="card">
                <div class="card-icon">📝</div>
                <div class="card-content">
                    <h2>學科報到</h2>
                    <p>請於測試前 30 分鐘辦理報到，務必攜帶准考證與附照片之身分證件正本。</p>
                </div>
                <div class="card-btn">瀏覽注意事項</div>
            </a>

            <a href="#technical-section" class="card">
                <div class="card-icon">💻</div>
                <div class="card-content">
                    <h2>術科報到</h2>
                    <p>進入試場前請確認服裝儀容，並檢查自備工具是否符合資訊類檢定規範。</p>
                </div>
                <div class="card-btn">瀏覽環境規範</div>
            </a>

            <a href="https://wdasec.gov.tw" target="_blank" class="card">
                <div class="card-icon">🏛️</div>
                <div class="card-content">
                    <h2>術科電子抽籤</h2>
                    <p>連結至勞動部技能檢定中心官方網站。正式測試前將由監場人員指引抽取題組與崗位。</p>
                </div>
                <div class="card-btn">前往技能檢定中心</div>
            </a>
        </div>

        <!-- 學科報到詳細內容區塊 -->
        <div id="subject-section" class="page-content">
            <a href="#top" class="back-btn">↑ 返回頂部選單</a>
            <h1>📝 學科報到與應試注意事項</h1>

            <div class="section">
                <h2>⏱️ 報到與入場時間</h2>
                <ul>
                    <li><strong>提前 30 分鐘報到</strong>：應檢人應於測試前 30 分鐘到達考場辦理報到手續。</li>
                    <li><strong>預備鈴響就座</strong>：預備鈴響時，請立即依場次座號就座。</li>
